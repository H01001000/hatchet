name: hatchet-jetstream-engine-test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: lab-only
      POSTGRES_DB: hatchet
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "127.0.0.1:19432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 1s
      timeout: 5s
      retries: 30
  nats:
    profiles: ["jetstream"]
    image: nats:2.12.4
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "127.0.0.1:19422:4222"
  rabbitmq:
    profiles: ["rabbitmq"]
    image: rabbitmq:3.13
    ports:
      - "127.0.0.1:19433:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 2s
      timeout: 5s
      retries: 30
